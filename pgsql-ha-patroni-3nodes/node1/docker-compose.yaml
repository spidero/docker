services:
  etcd1:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd1
    restart: always
    ports:
      - "2379:2379"
      - "2380:2380"
    command:
      - etcd
      - --name=etcd1
      - --initial-advertise-peer-urls=http://10.183.116.182:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://10.183.116.182:2379
      - --initial-cluster-token=etcd-cluster-token
      - --initial-cluster=etcd1=http://10.183.116.182:2380,etcd2=http://10.183.116.225:2380,etcd3=http://10.183.116.92:2380
      - --initial-cluster-state=new

  pg-node1:
    build: .
    container_name: pg-node1
    restart: always
    init: true
    ports:
      - "5432:5432"
      - "8008:8008"
    environment:
      PATRONI_NAME: patroni-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: 10.183.116.182:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: 10.183.116.182:5432
    volumes:
      - ./patroni.yml:/etc/patroni/patroni.yml:ro
      - pgdata:/var/lib/postgresql/data
    depends_on:
      - etcd1

volumes:
  pgdata:
