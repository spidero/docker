# RabbitMQ 3.8 cluster: rabbitmq1 is the seed node, rabbitmq2/3 join it as RAM nodes.

x-join-cluster: &join-cluster
  # Start the server in the background, wait until it is up, join the seed node,
  # then keep the container running (RabbitMQ runs detached).
  - bash
  - -c
  - |
    rabbitmq-server -detached
    rabbitmqctl await_startup --timeout 120
    rabbitmqctl stop_app
    rabbitmqctl reset
    rabbitmqctl join_cluster --ram rabbit@rabbitmq1
    rabbitmqctl start_app
    exec tail -f /dev/null

services:
  rabbitmq1:
    image: rabbitmq:3.8.23-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: "uniquecookie"
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "password"
      RABBITMQ_NODENAME: "rabbit@rabbitmq1"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 24
    networks:
      - rabbitmq_network

  rabbitmq2:
    image: rabbitmq:3.8.23-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    depends_on:
      rabbitmq1:
        condition: service_healthy
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: "uniquecookie"
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "password"
      RABBITMQ_NODENAME: "rabbit@rabbitmq2"
    networks:
      - rabbitmq_network
    command: *join-cluster

  rabbitmq3:
    image: rabbitmq:3.8.23-management
    container_name: rabbitmq3
    hostname: rabbitmq3
    depends_on:
      rabbitmq1:
        condition: service_healthy
    ports:
      - "5674:5672"
      - "15674:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: "uniquecookie"
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "password"
      RABBITMQ_NODENAME: "rabbit@rabbitmq3"
    networks:
      - rabbitmq_network
    command: *join-cluster

networks:
  rabbitmq_network:
    driver: bridge
