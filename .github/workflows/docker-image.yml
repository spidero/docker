name: Validate Docker Compose Files

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  validate-docker-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Validate every compose file (.yml and .yaml) with Docker Compose v2
      - name: Validate compose files
        run: |
          failed=0
          found=0
          while IFS= read -r -d '' file; do
            found=$((found + 1))
            echo "::group::$file"
            if docker compose -f "$file" config -q; then
              echo "OK"
            else
              echo "::error file=$file::invalid compose file"
              failed=1
            fi
            echo "::endgroup::"
          done < <(find . -path ./.git -prune -o -type f \
                     \( -name 'docker-compose.yml' -o -name 'docker-compose.yaml' \
                        -o -name 'compose.yml' -o -name 'compose.yaml' \) -print0 | sort -z)
          echo "Validated $found compose file(s)"
          exit $failed
